name: Scrape mubawab

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Lancer le scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          DEBUG_SCRAPER: "1"
        run: python scraper.py

      - name: Upload captures de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-captures
          path: debug/
          if-no-files-found: ignore

      - name: Sauvegarder les résultats (seen_listings.json + listings.json)
        run: |
          git config user.name "mubawab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_listings.json listings.json
          git diff --quiet --cached || git commit -m "Update listings [auto]"
          git push
