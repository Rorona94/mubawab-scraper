<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Repérage locaux — Casablanca</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #023047;
    --surface: #063C58;
    --surface-2: #0A4A68;
    --line: #15607F;
    --text: #F3FAFD;
    --text-muted: #8ECAE6;
    --paprika: #FB8500;
    --paprika-deep: #7A3F00;
    --turmeric: #FFB703;
    --sage: #219EBC;
    --sage-deep: #0E3E4E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 16px 12px 50px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paprika);
    margin: 0 0 4px;
    font-weight: 600;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0 0 4px;
    line-height: 1.05;
  }

  .subhead {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 16px;
  }
  .subhead b { color: var(--turmeric); font-weight: 600; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .panel-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel-label::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--paprika);
    display: inline-block;
  }

  .row { display: flex; gap: 8px; margin-bottom: 9px; }
  .row:last-child { margin-bottom: 0; }
  .field { flex: 1; min-width: 0; }

  .field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 7px 8px;
  }
  input[type="number"]:focus { outline: none; border-color: var(--paprika); }
  input[type="number"]::placeholder { color: #6B5A3E; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    background: var(--bg);
  }
  .chip.active {
    background: var(--paprika);
    border-color: var(--paprika);
    color: #2B0E00;
    font-weight: 600;
  }

  .reset-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }

  .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }
  .count b { color: var(--turmeric); font-weight: 600; }

  .reset {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: none;
    border: none;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0;
  }

  .card {
    position: relative;
    display: flex;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px;
    margin-bottom: 10px;
  }

  .card-photo {
    flex: 0 0 92px;
    width: 92px;
    height: 92px;
    border-radius: 3px;
    background: var(--surface-2) center/cover no-repeat;
    position: relative;
  }
  .card-photo.no-image::after {
    content: '—';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #574A34;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
  }

  .card-main { flex: 1; min-width: 0; }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
    margin-bottom: 4px;
  }

  .quartier-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--turmeric);
    font-weight: 600;
  }

  .stamp {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 7px;
    border: 1.5px solid;
    border-radius: 3px;
    transform: rotate(3deg);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .stamp.ideal { color: var(--sage); border-color: var(--sage); }
  .stamp.consider { color: var(--turmeric); border-color: var(--turmeric); }

  .card-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 14px;
    line-height: 1.25;
    margin: 0 0 6px;
  }

  .stats { display: flex; gap: 14px; margin-bottom: 6px; }
  .stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .stat-unit { font-size: 10px; color: var(--text-muted); font-weight: 500; }

  .specs-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px 8px;
    margin-bottom: 8px;
    padding: 8px;
    background: var(--surface-2);
    border-radius: 3px;
  }
  .spec-item { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .spec-icon {
    flex: 0 0 20px;
    width: 20px; height: 20px;
    color: var(--turmeric);
  }
  .spec-icon svg { width: 100%; height: 100%; }
  .spec-text { min-width: 0; }
  .spec-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    line-height: 1.2;
  }
  .spec-value {
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid;
  }
  .tag.ok { color: var(--sage); border-color: var(--sage-deep); background: rgba(169, 204, 123, 0.1); }
  .tag.warn { color: var(--turmeric); border-color: #5C4620; background: rgba(255, 187, 46, 0.08); }
  .tag.eq { color: var(--text-muted); border-color: var(--line); }

  .btn {
    display: inline-block;
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--paprika);
    padding: 6px 12px;
    border-radius: 3px;
    font-weight: 700;
  }

  .empty {
    text-align: center;
    padding: 36px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .empty-mark {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--paprika);
    margin-bottom: 6px;
  }
</style>
</head>
<body>

  <p class="eyebrow">Casablanca · locaux commerciaux</p>
  <h1>Repérage locaux</h1>
  <p class="subhead"><b id="lastUpdate">chargement…</b> — suivi automatique en continu</p>

  <div class="panel">
    <p class="panel-label">Filtrer</p>
    <div class="row">
      <div class="field">
        <label>Loyer min (DH)</label>
        <input id="prixMin" type="number" placeholder="0">
      </div>
      <div class="field">
        <label>Loyer max (DH)</label>
        <input id="prixMax" type="number" placeholder="Illimité">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Surface min (m²)</label>
        <input id="surfaceMin" type="number" placeholder="0">
      </div>
      <div class="field">
        <label>Surface max (m²)</label>
        <input id="surfaceMax" type="number" placeholder="Illimité">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Secteur</label>
        <div class="chips" id="quartierChips"></div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Extraction</label>
        <div class="chips">
          <div class="chip active" data-extraction="all">Toutes</div>
          <div class="chip" data-extraction="yes">Avec gaine</div>
          <div class="chip" data-extraction="maybe">Restauration ok</div>
        </div>
      </div>
    </div>
    <div class="reset-row">
      <span class="count" id="count">—</span>
      <button class="reset" id="resetBtn">Réinitialiser</button>
    </div>
  </div>

  <div id="list"></div>

  <script>
    let allListings = [];
    let activeQuartiers = new Set();
    let extractionFilter = 'all';

    const CONFIG_DEFAULTS = {
      budget_max: 25000,
      budget_max_hard: 40000,
      surface_min: 80,
      surface_max: 120,
      surface_tolerance: 25
    };
    let CFG = CONFIG_DEFAULTS;

    function evaluateListing(l) {
      let strict = true;
      if (l.prix != null) {
        if (l.prix > CFG.budget_max_hard) return null;
        if (l.prix > CFG.budget_max) strict = false;
      }
      if (l.surface != null) {
        if (l.surface < CFG.surface_min - CFG.surface_tolerance || l.surface > CFG.surface_max + CFG.surface_tolerance) return null;
        if (l.surface < CFG.surface_min || l.surface > CFG.surface_max) strict = false;
      }
      if (!l.gaine_extraction) strict = false;
      return { strict };
    }

    async function load() {
      try {
        const cfgRes = await fetch('config.json');
        if (cfgRes.ok) CFG = { ...CONFIG_DEFAULTS, ...(await cfgRes.json()) };
      } catch (e) {}

      const res = await fetch('listings.json');
      allListings = await res.json();

      document.getElementById('lastUpdate').textContent = allListings.length + ' locaux scannés';

      const quartiers = [...new Set(allListings.map(l => l.quartier))];
      const chipsContainer = document.getElementById('quartierChips');
      quartiers.forEach(q => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = q.replace(/_/g, ' ');
        chip.addEventListener('click', () => {
          if (activeQuartiers.has(q)) activeQuartiers.delete(q);
          else activeQuartiers.add(q);
          chip.classList.toggle('active');
          render();
        });
        chipsContainer.appendChild(chip);
      });

      document.querySelectorAll('[data-extraction]').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('[data-extraction]').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          extractionFilter = chip.dataset.extraction;
          render();
        });
      });

      ['prixMin', 'prixMax', 'surfaceMin', 'surfaceMax'].forEach(id => {
        document.getElementById(id).addEventListener('input', render);
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        ['prixMin', 'prixMax', 'surfaceMin', 'surfaceMax'].forEach(id => document.getElementById(id).value = '');
        activeQuartiers.clear();
        document.querySelectorAll('.chips .chip').forEach(c => c.classList.remove('active'));
        extractionFilter = 'all';
        document.querySelector('[data-extraction="all"]').classList.add('active');
        render();
      });

      render();
    }

    function render() {
      const prixMin = document.getElementById('prixMin').value;
      const prixMax = document.getElementById('prixMax').value;
      const surfaceMin = document.getElementById('surfaceMin').value;
      const surfaceMax = document.getElementById('surfaceMax').value;

      let filtered = allListings.filter(l => {
        if (prixMin && l.prix && l.prix < Number(prixMin)) return false;
        if (prixMax && l.prix && l.prix > Number(prixMax)) return false;
        if (surfaceMin && l.surface && l.surface < Number(surfaceMin)) return false;
        if (surfaceMax && l.surface && l.surface > Number(surfaceMax)) return false;
        if (activeQuartiers.size > 0 && !activeQuartiers.has(l.quartier)) return false;
        if (extractionFilter === 'yes' && !l.gaine_extraction) return false;
        if (extractionFilter === 'maybe' && !l.gaine_extraction && !l.restauration_mentionnee) return false;
        return true;
      });

      document.getElementById('count').innerHTML = `<b>${filtered.length}</b> / ${allListings.length}`;

      const list = document.getElementById('list');
      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty"><div class="empty-mark">Aucun résultat</div>Élargis les filtres pour voir plus de locaux.</div>`;
        return;
      }

      list.innerHTML = filtered.map(l => {
        const evalR = evaluateListing(l);
        const stamp = evalR
          ? (evalR.strict
              ? '<span class="stamp ideal">Idéal</span>'
              : '<span class="stamp consider">À confirmer</span>')
          : '';

        const ICONS = {
          type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
          etat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 7l3 3-9 9H5v-3z"/><path d="M13 8l3 3"/></svg>',
          annee: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></svg>',
          etage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20V4M6 10l6-6 6 6"/></svg>',
          sol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
          bain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h16v3a4 4 0 01-4 4H8a4 4 0 01-4-4z"/><path d="M6 12V6a2 2 0 012-2"/></svg>'
        };

        const specItems = [];
        if (l.type_bien) specItems.push(['type', 'Type', l.type_bien]);
        if (l.etat) specItems.push(['etat', 'État', l.etat]);
        if (l.etage) specItems.push(['etage', 'Étage', l.etage]);
        if (l.annee) specItems.push(['annee', 'Ancienneté', l.annee]);
        if (l.type_sol) specItems.push(['sol', 'Sol', l.type_sol]);
        if (l.salle_bain) specItems.push(['bain', 'Sdb', l.salle_bain]);

        const specsGrid = specItems.length
          ? `<div class="specs-grid">${specItems.map(([icon, label, value]) => `
              <div class="spec-item">
                <span class="spec-icon">${ICONS[icon]}</span>
                <span class="spec-text">
                  <div class="spec-label">${label}</div>
                  <div class="spec-value">${value}</div>
                </span>
              </div>
            `).join('')}</div>`
          : '';

        const tags = [];
        if (l.gaine_extraction) tags.push('<span class="tag ok">Gaine extraction</span>');
        else if (l.restauration_mentionnee) tags.push('<span class="tag warn">Extraction à confirmer</span>');
        (l.caracteristiques || []).slice(0, 4).forEach(c => {
          if (!/salle.*bain/i.test(c)) tags.push(`<span class="tag eq">${c}</span>`);
        });

        const photoStyle = l.image ? `style="background-image:url('${l.image}')"` : '';
        const photoClass = l.image ? 'card-photo' : 'card-photo no-image';

        return `
        <div class="card">
          <div class="${photoClass}" ${photoStyle}></div>
          <div class="card-main">
            <div class="top-row">
              <span class="quartier-tag">${l.quartier.replace(/_/g, ' ')}</span>
              ${stamp}
            </div>
            <h3 class="card-title">${l.titre}</h3>
            <div class="stats">
              <span class="stat-value">${l.prix ? l.prix.toLocaleString('fr-FR') : '—'}<span class="stat-unit"> DH</span></span>
              <span class="stat-value">${l.surface || '—'}<span class="stat-unit"> m²</span></span>
            </div>
            ${specsGrid}
            ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
            <a class="btn" href="${l.lien}" target="_blank" rel="noopener">Voir l'annonce</a>
          </div>
        </div>
      `;
      }).join('');
    }

    load();
  </script>
</body>
</html>
