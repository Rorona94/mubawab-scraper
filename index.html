<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Repérage — Chicken Street Casablanca</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16130F;
    --surface: #211B14;
    --surface-2: #2A2318;
    --line: #3B301F;
    --text: #F3ECDD;
    --text-muted: #9C8F79;
    --paprika: #D24E1E;
    --paprika-deep: #7A2E13;
    --turmeric: #E0A233;
    --sage: #8CA06B;
    --sage-deep: #3A4429;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 20px 16px 60px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paprika);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0 0 4px;
    line-height: 1.05;
  }

  .subhead {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 20px;
  }

  .subhead span { color: var(--turmeric); font-weight: 500; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px;
    margin-bottom: 20px;
  }

  .panel-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .panel-label::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--paprika);
    display: inline-block;
  }

  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  .field { flex: 1; min-width: 0; }

  .field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 8px;
  }
  input[type="number"]:focus { outline: none; border-color: var(--paprika); }
  input[type="number"]::placeholder { color: #574A34; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 11px;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    background: var(--bg);
  }
  .chip.active {
    background: var(--paprika-deep);
    border-color: var(--paprika);
    color: #FBDAC9;
  }

  .reset-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }

  .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }
  .count b { color: var(--turmeric); font-weight: 600; }

  .reset {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: none;
    border: none;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 0;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .card-photo {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: var(--surface-2) center/cover no-repeat;
    position: relative;
  }
  .card-photo.no-image {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-photo.no-image::after {
    content: 'PAS DE VISUEL';
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #574A34;
  }

  .quartier-tag {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(22, 19, 15, 0.85);
    border: 1px solid var(--line);
    color: var(--turmeric);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 3px;
  }

  .stamp {
    position: absolute;
    top: 8px;
    right: 8px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 10px;
    border: 2px solid;
    border-radius: 3px;
    transform: rotate(4deg);
    background: rgba(22, 19, 15, 0.75);
  }
  .stamp.ideal { color: var(--sage); border-color: var(--sage); }
  .stamp.consider { color: var(--turmeric); border-color: var(--turmeric); }

  .card-body { padding: 14px; }

  .card-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.3;
    margin: 0 0 10px;
  }

  .stats {
    display: flex;
    gap: 18px;
    margin-bottom: 10px;
  }

  .stat-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .stat-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid;
  }
  .tag.ok { color: var(--sage); border-color: var(--sage-deep); background: rgba(140, 160, 107, 0.08); }
  .tag.warn { color: var(--turmeric); border-color: #5C4620; background: rgba(224, 162, 51, 0.08); }

  .btn {
    display: block;
    text-align: center;
    text-decoration: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--paprika);
    padding: 10px;
    border-radius: 3px;
    font-weight: 600;
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .empty-mark {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--paprika);
    margin-bottom: 6px;
  }
</style>
</head>
<body>

  <p class="eyebrow">Dossier de repérage · Casablanca</p>
  <h1>Chicken Street</h1>
  <p class="subhead">Locaux commerciaux suivis en continu — <span id="lastUpdate">chargement…</span></p>

  <div class="panel">
    <p class="panel-label">Filtrer</p>
    <div class="row">
      <div class="field">
        <label>Loyer min (DH)</label>
        <input id="prixMin" type="number" placeholder="0">
      </div>
      <div class="field">
        <label>Loyer max (DH)</label>
        <input id="prixMax" type="number" placeholder="Illimité">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Surface min (m²)</label>
        <input id="surfaceMin" type="number" placeholder="0">
      </div>
      <div class="field">
        <label>Surface max (m²)</label>
        <input id="surfaceMax" type="number" placeholder="Illimité">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Secteur</label>
        <div class="chips" id="quartierChips"></div>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Extraction</label>
        <div class="chips">
          <div class="chip active" data-extraction="all">Toutes</div>
          <div class="chip" data-extraction="yes">Avec gaine</div>
          <div class="chip" data-extraction="maybe">Restauration ok</div>
        </div>
      </div>
    </div>
    <div class="reset-row">
      <span class="count" id="count">—</span>
      <button class="reset" id="resetBtn">Réinitialiser</button>
    </div>
  </div>

  <div id="list"></div>

  <script>
    let allListings = [];
    let activeQuartiers = new Set();
    let extractionFilter = 'all';

    const CONFIG_DEFAULTS = {
      budget_max: 25000,
      budget_max_hard: 40000,
      surface_min: 80,
      surface_max: 120,
      surface_tolerance: 25
    };
    let CFG = CONFIG_DEFAULTS;

    function evaluateListing(l) {
      const reasons = [];
      let strict = true;
      if (l.prix != null) {
        if (l.prix > CFG.budget_max_hard) return null;
        if (l.prix > CFG.budget_max) { strict = false; reasons.push('Loyer au-dessus du plafond idéal'); }
      }
      if (l.surface != null) {
        if (l.surface < CFG.surface_min - CFG.surface_tolerance || l.surface > CFG.surface_max + CFG.surface_tolerance) return null;
        if (l.surface < CFG.surface_min || l.surface > CFG.surface_max) { strict = false; reasons.push('Surface hors cible 80-120 m²'); }
      }
      if (!l.gaine_extraction) strict = false;
      return { strict, reasons };
    }

    async function load() {
      try {
        const cfgRes = await fetch('config.json');
        if (cfgRes.ok) CFG = { ...CONFIG_DEFAULTS, ...(await cfgRes.json()) };
      } catch (e) {}

      const res = await fetch('listings.json');
      allListings = await res.json();

      document.getElementById('lastUpdate').textContent = allListings.length + ' locaux scannés';

      const quartiers = [...new Set(allListings.map(l => l.quartier))];
      const chipsContainer = document.getElementById('quartierChips');
      quartiers.forEach(q => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = q.replace(/_/g, ' ');
        chip.addEventListener('click', () => {
          if (activeQuartiers.has(q)) activeQuartiers.delete(q);
          else activeQuartiers.add(q);
          chip.classList.toggle('active');
          render();
        });
        chipsContainer.appendChild(chip);
      });

      document.querySelectorAll('[data-extraction]').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('[data-extraction]').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          extractionFilter = chip.dataset.extraction;
          render();
        });
      });

      ['prixMin', 'prixMax', 'surfaceMin', 'surfaceMax'].forEach(id => {
        document.getElementById(id).addEventListener('input', render);
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        ['prixMin', 'prixMax', 'surfaceMin', 'surfaceMax'].forEach(id => document.getElementById(id).value = '');
        activeQuartiers.clear();
        document.querySelectorAll('.chips .chip').forEach(c => c.classList.remove('active'));
        extractionFilter = 'all';
        document.querySelector('[data-extraction="all"]').classList.add('active');
        render();
      });

      render();
    }

    function render() {
      const prixMin = document.getElementById('prixMin').value;
      const prixMax = document.getElementById('prixMax').value;
      const surfaceMin = document.getElementById('surfaceMin').value;
      const surfaceMax = document.getElementById('surfaceMax').value;

      let filtered = allListings.filter(l => {
        if (prixMin && l.prix && l.prix < Number(prixMin)) return false;
        if (prixMax && l.prix && l.prix > Number(prixMax)) return false;
        if (surfaceMin && l.surface && l.surface < Number(surfaceMin)) return false;
        if (surfaceMax && l.surface && l.surface > Number(surfaceMax)) return false;
        if (activeQuartiers.size > 0 && !activeQuartiers.has(l.quartier)) return false;
        if (extractionFilter === 'yes' && !l.gaine_extraction) return false;
        if (extractionFilter === 'maybe' && !l.gaine_extraction && !l.restauration_mentionnee) return false;
        return true;
      });

      document.getElementById('count').innerHTML = `<b>${filtered.length}</b> / ${allListings.length}`;

      const list = document.getElementById('list');
      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty"><div class="empty-mark">Aucun résultat</div>Élargis les filtres pour voir plus de locaux.</div>`;
        return;
      }

      list.innerHTML = filtered.map(l => {
        const evalR = evaluateListing(l);
        const stamp = evalR
          ? (evalR.strict
              ? '<div class="stamp ideal">Match idéal</div>'
              : '<div class="stamp consider">À confirmer</div>')
          : '';

        const tags = [];
        if (l.gaine_extraction) tags.push('<span class="tag ok">Gaine extraction</span>');
        else if (l.restauration_mentionnee) tags.push('<span class="tag warn">Extraction à confirmer</span>');

        const photoStyle = l.image ? `style="background-image:url('${l.image}')"` : '';
        const photoClass = l.image ? 'card-photo' : 'card-photo no-image';

        return `
        <div class="card">
          <div class="${photoClass}" ${photoStyle}>
            <span class="quartier-tag">${l.quartier.replace(/_/g, ' ')}</span>
            ${stamp}
          </div>
          <div class="card-body">
            <h3 class="card-title">${l.titre}</h3>
            <div class="stats">
              <div>
                <div class="stat-label">Loyer</div>
                <div class="stat-value">${l.prix ? l.prix.toLocaleString('fr-FR') + ' DH' : '—'}</div>
              </div>
              <div>
                <div class="stat-label">Surface</div>
                <div class="stat-value">${l.surface ? l.surface + ' m²' : '—'}</div>
              </div>
            </div>
            ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
            <a class="btn" href="${l.lien}" target="_blank" rel="noopener">Voir l'annonce</a>
          </div>
        </div>
      `;
      }).join('');
    }

    load();
  </script>
</body>
</html>
