<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Localia — Locaux commerciaux Casablanca</title>
<style>
:root{
  --bg:#f7f8fc;
  --panel:#ffffff;
  --sidebar:#101126;
  --sidebar2:#151638;
  --purple:#6548e8;
  --purple2:#7c5cf0;
  --purple-soft:#f0ecff;
  --text:#171a25;
  --muted:#7b8190;
  --line:#e8eaf0;
  --green:#4aa76a;
  --green-bg:#eaf7ed;
  --red:#ce5555;
  --red-bg:#fdeeee;
  --orange:#e0a23b;
  --orange-bg:#fff5df;
  --blue:#4776dd;
  --blue-bg:#eaf0ff;
  --shadow:0 8px 30px rgba(24,28,45,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:216px minmax(0,1fr);
}
.sidebar{
  background:linear-gradient(180deg,var(--sidebar),var(--sidebar2));
  color:white;
  padding:28px 18px;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
}
.brand{
  display:flex;align-items:center;gap:12px;
  padding:0 10px 26px;
}
.brandIcon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,#765cf3,#5a3bd8);
  display:grid;place-items:center;font-size:20px;
  box-shadow:0 8px 20px rgba(101,72,232,.35);
}
.brandTitle{font-size:20px;font-weight:800;line-height:1}
.brandSub{font-size:11px;color:#b9bbcb;margin-top:5px}
.nav{display:flex;flex-direction:column;gap:8px}
.navItem{
  border:0;background:transparent;color:#d4d6e2;
  padding:12px 14px;border-radius:10px;text-align:left;
  display:flex;align-items:center;gap:12px;font-weight:600;
}
.navItem:hover{background:rgba(255,255,255,.06);color:white}
.navItem.active{background:linear-gradient(90deg,#5f42d8,#744ff0);color:white}
.sidebarSpacer{flex:1}
.account{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);
  border-radius:14px;padding:12px;margin-top:16px;
  display:flex;align-items:center;gap:10px;
}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#7b5af1,#5a3bd8);
  display:grid;place-items:center;font-weight:800;font-size:12px;
}
.accountName{font-size:13px;font-weight:700}
.accountSub{font-size:11px;color:#b8bbcb;margin-top:2px}

.main{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 0;
  transition:grid-template-columns .25s ease;
}
.main.detail-open{grid-template-columns:minmax(0,1fr) 510px}

.workspace{min-width:0;padding:26px 26px 40px}
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  margin-bottom:22px;
}
.topbar h1{margin:0;font-size:28px;letter-spacing:-.03em}
.topbar p{margin:6px 0 0;color:var(--muted);font-size:14px}
.topActions{display:flex;gap:10px}
.iconBtn,.btn{
  border:1px solid var(--line);background:white;border-radius:10px;
  padding:10px 13px;color:var(--text);font-weight:700;
}
.btn.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;border-color:transparent}
.searchFilters{
  display:grid;
  grid-template-columns:minmax(260px,1.4fr) 125px 140px 125px 155px 85px;
  gap:10px;margin-bottom:18px;
}
.control{
  background:white;border:1px solid var(--line);border-radius:10px;
  display:flex;align-items:center;min-height:42px;padding:0 12px;
}
.control input,.control select{
  width:100%;border:0;outline:0;background:transparent;color:var(--text)
}
.control.search span{color:#9aa0ad;margin-right:8px}
.stats{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px
}
.stat{
  border:1px solid var(--line);background:white;border-radius:12px;padding:15px 16px;
  display:flex;align-items:center;gap:12px;
}
.statIcon{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px
}
.stat:nth-child(1) .statIcon{background:var(--purple-soft);color:var(--purple)}
.stat:nth-child(2) .statIcon{background:var(--green-bg);color:var(--green)}
.stat:nth-child(3) .statIcon{background:var(--orange-bg);color:var(--orange)}
.stat:nth-child(4) .statIcon{background:var(--blue-bg);color:var(--blue)}
.statValue{font-size:22px;font-weight:800;line-height:1}
.statLabel{font-size:11px;color:var(--muted);margin-top:4px}
.listToolbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 14px
}
.sortWrap{display:flex;align-items:center;gap:8px;font-size:13px;color:#505665}
.sortWrap select{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 34px 9px 11px}
.viewToggle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:white}
.viewToggle button{border:0;background:white;padding:9px 13px;color:#667}
.viewToggle button.active{background:var(--purple);color:white}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px
}
.grid.listMode{grid-template-columns:1fr}
.card{
  background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 2px 10px rgba(24,28,45,.035);
  transition:.18s transform,.18s box-shadow;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cardMedia{
  height:172px;background:linear-gradient(135deg,#dfe5ef,#f4f6f9);
  position:relative;overflow:hidden;
}
.cardMedia img{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{
  width:100%;height:100%;display:grid;place-items:center;color:#9ca5b3;font-size:42px
}
.badgeTop{
  position:absolute;left:10px;top:10px;
  background:var(--green);color:white;font-size:10px;font-weight:800;
  padding:5px 8px;border-radius:6px;text-transform:uppercase
}
.badgeTop.purple{background:var(--purple)}
.favoriteBtn{
  position:absolute;right:9px;top:9px;width:32px;height:32px;border-radius:50%;
  border:0;background:rgba(24,28,45,.68);color:white;font-size:17px;display:grid;place-items:center
}
.favoriteBtn.active{background:#fff;color:#e54f63}
.cardBody{padding:14px}
.cardTitle{font-size:15px;font-weight:800;line-height:1.35;min-height:40px}
.location{font-size:12px;color:#6f7684;margin-top:7px}
.price{font-size:19px;font-weight:850;color:#6045d8;margin-top:13px}
.price small{font-size:11px;color:#7c8290;font-weight:500}
.quickInfo{display:flex;gap:14px;margin-top:11px;font-size:12px;color:#4e5563}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{padding:5px 8px;border-radius:7px;font-size:10px}
.tag.good{background:var(--green-bg);color:#318652}
.tag.bad{background:var(--red-bg);color:#b24343}
.tag.warn{background:var(--orange-bg);color:#a87520}
.cardFooter{border-top:1px solid var(--line);margin-top:12px;padding-top:11px;display:flex;justify-content:space-between;font-size:11px;color:#8a909c}
.openLink{color:#5e45d2;font-weight:700;cursor:pointer}
.grid.listMode .card{display:grid;grid-template-columns:230px 1fr}
.grid.listMode .cardMedia{height:100%;min-height:180px}

.detailPanel{
  position:sticky;top:0;height:100vh;background:white;border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .25s ease;overflow:auto;z-index:20
}
.main.detail-open .detailPanel{transform:translateX(0)}
.detailInner{padding:18px}
.detailTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.backBtn{border:0;background:transparent;font-weight:700;color:#444}
.detailActions{display:flex;gap:8px}
.detailHero{
  height:210px;border-radius:11px;background:#edf1f5;overflow:hidden;position:relative
}
.detailHero img{width:100%;height:100%;object-fit:cover}
.thumbRow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:8px}
.thumb{height:50px;border-radius:7px;background:#edf1f5;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.detailTitle{font-size:19px;font-weight:850;margin:18px 0 6px}
.detailPrice{font-size:21px;font-weight:900;color:#6045d8;margin-top:14px}
.detailPrice small{font-size:11px;color:#7d8390;font-weight:500}
.detailMetrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.metric{text-align:center}
.metricVal{font-size:13px;font-weight:800}
.metricLabel{font-size:10px;color:#858b98;margin-top:3px}
.section{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.section h3{font-size:13px;margin:0 0 10px}
.description{font-size:12px;line-height:1.65;color:#59606d}
.twoCols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.infoBox{background:#fafbfc;border:1px solid var(--line);border-radius:11px;padding:12px}
.infoBox h4{margin:0 0 10px;font-size:12px}
.infoRow{display:flex;justify-content:space-between;gap:10px;font-size:10px;margin:8px 0;color:#6f7683}
.infoRow b{color:#2e3340}
.important{display:flex;gap:7px;align-items:flex-start;font-size:10px;margin:8px 0;color:#58606c}
.important .check{color:#37a35f}
.bottomActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 8px}
.bottomActions a,.bottomActions button{
  text-decoration:none;text-align:center;border-radius:10px;padding:12px;font-weight:800;font-size:12px
}
.outline{border:1px solid var(--purple);background:white;color:var(--purple)}
.filled{border:1px solid var(--purple);background:linear-gradient(135deg,var(--purple),var(--purple2));color:white}
.empty{
  grid-column:1/-1;background:white;border:1px dashed #d8dce5;border-radius:12px;
  padding:50px;text-align:center;color:#7d8390
}
@media(max-width:1280px){
  .main.detail-open{grid-template-columns:minmax(0,1fr) 430px}
  .searchFilters{grid-template-columns:minmax(220px,1.5fr) repeat(4,minmax(105px,1fr))}
  .searchFilters .control:last-child{display:none}
}
@media(max-width:1050px){
  .app{grid-template-columns:78px minmax(0,1fr)}
  .brandText,.navItem span,.accountMeta{display:none}
  .brand{justify-content:center;padding-left:0;padding-right:0}
  .navItem{justify-content:center}
  .main.detail-open{grid-template-columns:1fr}
  .detailPanel{position:fixed;right:0;top:0;width:min(510px,100vw)}
}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .workspace{padding:18px 14px 30px}
  .topbar{flex-direction:column}
  .searchFilters{grid-template-columns:1fr 1fr}
  .searchFilters .control.search{grid-column:1/-1}
  .stats{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brandIcon">🏢</div>
      <div class="brandText">
        <div class="brandTitle">Localia</div>
        <div class="brandSub">Locaux commerciaux</div>
      </div>
    </div>

    <nav class="nav">
      <button class="navItem active" data-section="annonces"><b>⌂</b><span>Annonces</span></button>
      <button class="navItem" data-section="favoris"><b>♡</b><span>Favoris</span></button>
    </nav>

    <div class="sidebarSpacer"></div>
    <div class="account">
      <div class="avatar">TB</div>
      <div class="accountMeta">
        <div class="accountName">Taous B.</div>
        <div class="accountSub">Compte</div>
      </div>
    </div>
  </aside>

  <div class="main" id="main">
    <main class="workspace">
      <div class="topbar">
        <div>
          <h1>Annonces</h1>
          <p>Trouvez le local commercial idéal à Casablanca</p>
        </div>
        <div class="topActions">
          <button class="iconBtn">🔔</button>
          <button class="btn primary" id="importBtn">↥ Importer le dernier JSON</button>
          <input type="file" id="fileInput" accept=".json,.txt" hidden>
        </div>
      </div>

      <div class="searchFilters">
        <div class="control search"><span>⌕</span><input id="search" placeholder="Rechercher un quartier, une rue..." /></div>
        <div class="control"><select id="city"><option>Casablanca</option></select></div>
        <div class="control"><select id="quartier"><option value="">Tous quartiers</option></select></div>
        <div class="control"><select id="surfacePreset"><option value="80-120">80 – 120 m²</option><option value="55-145">55 – 145 m²</option><option value="all">Toutes surfaces</option></select></div>
        <div class="control"><select id="pricePreset"><option value="25000">Prix max 25 000 DH</option><option value="40000">Prix max 40 000 DH</option><option value="all">Tous les prix</option></select></div>
        <button class="control" id="resetFilters">☷ Filtres</button>
      </div>

      <div class="stats">
        <div class="stat"><div class="statIcon">🏢</div><div><div class="statValue" id="countStat">0</div><div class="statLabel">annonces trouvées</div></div></div>
        <div class="stat"><div class="statIcon">✤</div><div><div class="statValue" id="extractStat">0</div><div class="statLabel">avec extraction possible</div></div></div>
        <div class="stat"><div class="statIcon">🍴</div><div><div class="statValue" id="foodStat">0</div><div class="statLabel">avec restauration possible</div></div></div>
        <div class="stat"><div class="statIcon">♡</div><div><div class="statValue" id="favStat">0</div><div class="statLabel">favoris</div></div></div>
      </div>

      <div class="listToolbar">
        <div class="sortWrap">
          <span>Trier par :</span>
          <select id="sort">
            <option value="relevance">Pertinence</option>
            <option value="priceAsc">Prix croissant</option>
            <option value="priceDesc">Prix décroissant</option>
            <option value="surfaceAsc">Surface croissante</option>
          </select>
        </div>
        <div class="viewToggle">
          <button id="gridBtn" class="active">▦ Grille</button>
          <button id="listBtn">☷ Liste</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
    </main>

    <aside class="detailPanel" id="detailPanel">
      <div class="detailInner" id="detailInner"></div>
    </aside>
  </div>
</div>

let listings = JSON.parse(localStorage.getItem('localia_listings') || 'null') || EMBEDDED_LISTINGS;
let favorites = new Set(JSON.parse(localStorage.getItem('localia_favorites') || '[]'));
let activeSection = 'annonces';
let viewMode = 'grid';
let selectedId = null;

const el = id => document.getElementById(id);

function esc(v=''){
  return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normQuartier(q=''){ return q.replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase()); }
function fmtPrice(v){ return v ? Number(v).toLocaleString('fr-FR')+' DH' : 'Prix à consulter'; }
function getImage(l){
  return l.image || l.image_url || l.photo || (Array.isArray(l.images) && l.images[0]) || null;
}
function getImages(l){
  if(Array.isArray(l.images) && l.images.length) return l.images.filter(Boolean);
  const img = getImage(l); return img ? [img] : [];
}
function extractionState(l){
  if(l.extraction_status==='oui' || l.gaine_extraction) return 'yes';
  if(l.extraction_status==='non' || l.extraction_interdite) return 'no';
  return 'maybe';
}
function foodState(l){
  if(l.restauration_interdite) return 'no';
  if(l.restauration_mentionnee) return 'yes';
  return 'maybe';
}
function isNewLike(l){
  return l.id && String(l.id).slice(-1)%3===0;
}
function scoreListing(l){
  let s=0;
  if(l.surface>=80&&l.surface<=120)s+=4;
  if(l.prix&&l.prix<=25000)s+=4;
  if(extractionState(l)==='yes')s+=3;
  if(foodState(l)==='yes')s+=2;
  if(l.restauration_interdite)s-=3;
  return s;
}
function inferFeatures(l){
  if(Array.isArray(l.caracteristiques)&&l.caracteristiques.length) return l.caracteristiques;
  const t=((l.titre||'')+' '+(l.description||'')).toLowerCase();
  const out=[];
  const map=[
    ['climatisation','Climatisation'],
    ['mezzanine','Mezzanine'],
    ['vitrine','Grande vitrine'],
    ['rez-de-chaussée','RDC'],
    ['rez de chaussée','RDC'],
    ['concierge','Concierge'],
    ['sécurité','Sécurité'],
    ['garage','Garage'],
    ['ascenseur','Ascenseur'],
    ['porte blindée','Porte blindée']
  ];
  map.forEach(([k,v])=>{if(t.includes(k)&&!out.includes(v))out.push(v)});
  return out.slice(0,8);
}

function populateQuartiers(){
  const q=el('quartier'), current=q.value;
  q.innerHTML='<option value="">Tous quartiers</option>';
  [...new Set(listings.map(l=>l.quartier).filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement('option');o.value=v;o.textContent=normQuartier(v);q.appendChild(o);
  });
  q.value=current;
}

function getFilters(){
  const surf=el('surfacePreset').value;
  let smin=0,smax=Infinity;
  if(surf==='80-120'){smin=80;smax=120}
  if(surf==='55-145'){smin=55;smax=145}
  const p=el('pricePreset').value==='all'?Infinity:Number(el('pricePreset').value);
  return {q:el('search').value.trim().toLowerCase(),quartier:el('quartier').value,smin,smax,p};
}
function filteredListings(){
  const f=getFilters();
  let arr=listings.filter(l=>{
    if(activeSection==='favoris' && !favorites.has(String(l.id))) return false;
    if(f.q && !((l.titre||'')+' '+(l.description||'')+' '+(l.quartier||'')).toLowerCase().includes(f.q)) return false;
    if(f.quartier && l.quartier!==f.quartier)return false;
    if(l.surface && (l.surface<f.smin||l.surface>f.smax))return false;
    if(l.prix && l.prix>f.p)return false;
    return true;
  });
  const sort=el('sort').value;
  if(sort==='priceAsc')arr.sort((a,b)=>(a.prix||999999)-(b.prix||999999));
  else if(sort==='priceDesc')arr.sort((a,b)=>(b.prix||0)-(a.prix||0));
  else if(sort==='surfaceAsc')arr.sort((a,b)=>(a.surface||999999)-(b.surface||999999));
  else arr.sort((a,b)=>scoreListing(b)-scoreListing(a));
  return arr;
}

function render(){
  populateQuartiers();
  const arr=filteredListings();
  el('countStat').textContent=arr.length;
  el('extractStat').textContent=arr.filter(l=>extractionState(l)==='yes').length;
  el('foodStat').textContent=arr.filter(l=>foodState(l)==='yes').length;
  el('favStat').textContent=favorites.size;

  const grid=el('grid');
  grid.classList.toggle('listMode',viewMode==='list');
  if(!arr.length){grid.innerHTML='<div class="empty">Aucune annonce ne correspond à ces critères.</div>';return}
  grid.innerHTML=arr.map(l=>{
    const img=getImage(l), ext=extractionState(l), food=foodState(l), fav=favorites.has(String(l.id));
    const topClass = scoreListing(l)>=8 ? 'purple' : '';
    const topText = scoreListing(l)>=8 ? 'TOP EMPLACEMENT' : isNewLike(l) ? 'NOUVEAU' : ext==='yes' ? 'EXTRACTION POSSIBLE' : 'À ÉTUDIER';
    return `
    <article class="card">
      <div class="cardMedia" onclick="openDetail('${esc(l.id)}')">
        ${img?`<img src="${esc(img)}" alt="">`:`<div class="placeholder">🏢</div>`}
        <span class="badgeTop ${topClass}">${topText}</span>
        <button class="favoriteBtn ${fav?'active':''}" onclick="event.stopPropagation();toggleFavorite('${esc(l.id)}')">${fav?'♥':'♡'}</button>
      </div>
      <div class="cardBody">
        <div class="cardTitle" onclick="openDetail('${esc(l.id)}')">${esc(l.titre||'Local commercial')}</div>
        <div class="location">⌖ ${esc(normQuartier(l.quartier||''))}, Casablanca</div>
        <div class="price">${fmtPrice(l.prix)} <small>/ mois</small></div>
        <div class="quickInfo">
          <span>⛶ ${l.surface?l.surface+' m²':'—'}</span>
          <span>▣ ${inferFeatures(l).includes('RDC')?'RDC':'—'}</span>
        </div>
        <div class="tags">
          <span class="tag ${ext==='yes'?'good':ext==='no'?'bad':'warn'}">Extraction : ${ext==='yes'?'Oui':ext==='no'?'Non':'À confirmer'}</span>
          <span class="tag ${food==='yes'?'good':food==='no'?'bad':'warn'}">Restauration : ${food==='yes'?'Oui':food==='no'?'Non':'À confirmer'}</span>
        </div>
        <div class="cardFooter">
          <span>Mise à jour auto</span>
          <span class="openLink" onclick="openDetail('${esc(l.id)}')">↗</span>
        </div>
      </div>
    </article>`;
  }).join('');
}

function toggleFavorite(id){
  id=String(id);
  if(favorites.has(id))favorites.delete(id); else favorites.add(id);
  localStorage.setItem('localia_favorites',JSON.stringify([...favorites]));
  if(selectedId===id) renderDetail(listings.find(l=>String(l.id)===id));
  render();
}

function openDetail(id){
  const l=listings.find(x=>String(x.id)===String(id)); if(!l)return;
  selectedId=String(id);
  el('main').classList.add('detail-open');
  renderDetail(l);
}
function closeDetail(){el('main').classList.remove('detail-open');selectedId=null}

  const imgs=getImages(l);
  const ext=extractionState(l), food=foodState(l), fav=favorites.has(String(l.id));

  el('detailInner').innerHTML=`

    <div class="location">⌖ ${esc(normQuartier(l.quartier||''))}, Casablanca</div>

    <div class="detailMetrics">
      <div class="metric"><div class="metricVal">${l.surface?l.surface+' m²':'—'}</div><div class="metricLabel">Surface totale</div></div>
      <div class="metric"><div class="metricVal">${features.includes('RDC')?'RDC':'—'}</div><div class="metricLabel">Étage</div></div>
      <div class="metric"><div class="metricVal">—</div><div class="metricLabel">Façade</div></div>
      <div class="metric"><div class="metricVal">${ext==='yes'?'Oui':ext==='no'?'Non':'?'}</div><div class="metricLabel">Gaine d’extraction</div></div>
    </div>

    <div class="tags">
      <span class="tag ${food==='yes'?'good':food==='no'?'bad':'warn'}">Restauration : ${food==='yes'?'Oui':food==='no'?'Non':'À confirmer'}</span>
      ${features.includes('Climatisation')?'<span class="tag good">Climatisation : Oui</span>':''}
    </div>

    <div class="section">
      <h3>Description</h3>
      <div class="description">${esc(l.description||'Description complète non disponible dans le flux actuel. Ouvrez l’annonce Mubawab pour voir tous les détails.')}</div>
    </div>

    <div class="section twoCols">
      <div class="infoBox">
        <h4>Caractéristiques générales</h4>
        <div class="infoRow"><span>Type de bien</span><b>Local commercial</b></div>
        <div class="infoRow"><span>Surface totale</span><b>${l.surface?l.surface+' m²':'—'}</b></div>
        <div class="infoRow"><span>Étage</span><b>${features.includes('RDC')?'RDC':'—'}</b></div>
        <div class="infoRow"><span>État</span><b>À vérifier</b></div>
        ${features.slice(0,5).map(f=>`<div class="infoRow"><span>${esc(f)}</span><b>Oui</b></div>`).join('')}
      </div>
      <div class="infoBox">
        <h4>Informations importantes</h4>
        <div class="important"><span class="check">${ext==='yes'?'✓':'•'}</span><span>${ext==='yes'?'Gaine d’extraction existante':ext==='no'?'Extraction absente / interdite':'Extraction à confirmer'}</span></div>
        <div class="important"><span class="check">${food==='yes'?'✓':'•'}</span><span>${food==='yes'?'Convient potentiellement à la restauration':food==='no'?'Restauration interdite':'Restauration à confirmer'}</span></div>
        <div class="important"><span class="check">•</span><span>Bail et autorisations à vérifier</span></div>
        <div class="important"><span class="check">•</span><span>Charges et conditions à confirmer</span></div>
      </div>
    </div>

    <div class="bottomActions">
      <a class="outline" href="${esc(l.lien||'#')}" target="_blank">Voir sur Mubawab ↗</a>
      <button class="filled" onclick="toggleFavorite('${esc(l.id)}')">${fav?'♥ Retirer des favoris':'♡ Ajouter aux favoris'}</button>
    </div>`;
}

el('importBtn').onclick=()=>el('fileInput').click();
el('fileInput').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data))throw new Error();
    listings=data;localStorage.setItem('localia_listings',JSON.stringify(data));
    render();alert(data.length+' annonces importées.');
  }catch{alert('Fichier JSON invalide.')}
  e.target.value='';
});

['search','quartier','surfacePreset','pricePreset','sort'].forEach(id=>el(id).addEventListener(id==='search'?'input':'change',render));
el('resetFilters').onclick=()=>{
  el('search').value='';el('quartier').value='';el('surfacePreset').value='80-120';el('pricePreset').value='25000';render();
};
el('gridBtn').onclick=()=>{viewMode='grid';el('gridBtn').classList.add('active');el('listBtn').classList.remove('active');render()};
el('listBtn').onclick=()=>{viewMode='list';el('listBtn').classList.add('active');el('gridBtn').classList.remove('active');render()};

document.querySelectorAll('.navItem').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.navItem').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
    activeSection=btn.dataset.section;
    render();
  });
});

render();
</script>
</body>
</html>
